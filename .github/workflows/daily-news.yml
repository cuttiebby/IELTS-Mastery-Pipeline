name: 每日全球新闻摘要

# =============================================================================
# 工作流说明
# =============================================================================
# 名称：Daily Global News Digest
# 功能：每天早上 8:00 自动获取全球新闻，生成 AI 点评，保存为 Markdown
# 触发条件：按 cron 表达式定时执行（每天 8:00 UTC，即北京时间 16:00）
# =============================================================================

on:
  # 定时触发：每天 UTC 8:00 (北京时间 16:00)
  schedule:
    - cron: '0 8 * * *'

  # 支持手动触发（用于测试）
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式（仅获取少量新闻）'
        required: false
        default: false
        type: boolean

# 设置环境变量供所有 job 使用
env:
  # Claude API 密钥（在仓库 Settings -> Secrets 中配置）
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # World News API 密钥（在仓库 Settings -> Secrets 中配置）
  WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}

# 定义工作流任务
jobs:
  # 主任务：生成新闻摘要
  generate-news:
    # 运行环境和配置
    runs-on: ubuntu-latest

    steps:
      # =========================================================================
      # 步骤 1：检出现有代码
      # =========================================================================
      - name: 检出代码
        uses: actions/checkout@v4

      # =========================================================================
      # 步骤 2：设置 Python 环境
      # =========================================================================
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          # 使用 Python 3.11 版本
          python-version: '3.11'
          # 启用依赖缓存以加快构建速度
          cache: 'pip'

      # =========================================================================
      # 步骤 3：安装 Python 依赖
      # =========================================================================
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r News/requirements.txt

      # =========================================================================
      # 步骤 4：运行新闻生成脚本
      # =========================================================================
      - name: 生成每日新闻摘要
        run: |
          python News/daily_news.py
        env:
          # 确保环境变量在运行时可用
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}

      # =========================================================================
      # 步骤 5：提交生成的新闻文件
      # =========================================================================
      - name: 提交新闻文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # 提交 message
          commit_message: |
            docs: 添加每日新闻摘要

            自动生成的每日全球新闻摘要

          # 要提交的文件
          file_pattern: |
            daily_news/*.md
          # 提交者信息
          author_name: GitHub Actions Bot
          author_email: actions@github.com
          # 分支（默认为当前分支）
          branch: main

      # =========================================================================
      # 步骤 6：配置定时任务说明
      # =========================================================================
      - name: 显示触发信息
        run: |
          echo "=============================================="
          echo "每日新闻摘要生成任务已成功执行"
          echo "=============================================="
          echo "触发时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "生成文件: daily_news/$(date +%Y-%m-%d).md"
          echo "=============================================="