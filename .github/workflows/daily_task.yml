name: Daily English Article Generator

on:
  schedule:
    # UTC 0:00 = 北京时间 8:00
    - cron: "0 0 * * *"
  workflow_dispatch:
    # 允许手动触发

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily article generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python daily_generator.py

      - name: Commit and push article
        run: |
          cd "$GITHUB_WORKSPACE/Learning English/Article" || exit 0
          latest=$(ls -t *.md 2>/dev/null | head -1)
          if [[ -n "$latest" ]]; then
            cd "$GITHUB_WORKSPACE"
            git config user.name "布谷"
            git config user.email "orangle220@gmail.com"
            git add "Learning English/Article/"
            git diff --staged --quiet || git commit -m "docs(Article): add daily article $(date +%Y-%m-%d)"
            git push
          fi