name: Daily English Article Generator

on:
  schedule:
    # UTC 0:00 = 北京时间 8:00
    - cron: "0 0 * * *"
  workflow_dispatch:
    # 允许手动触发

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily article generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python daily_generator.py

      - name: Commit and push changes
        uses: stefanzwl/setup-git-auto-commit@v2
        with:
          commit_message: "docs(Article): add daily article – ${{ steps.date.outputs.date }}"
          add_directory: "Learning English/Article"
          skip_dirty_check: false
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}